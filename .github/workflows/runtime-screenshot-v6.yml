name: Runtime Screenshot V6 Pass

on:
  push:
    branches:
      - redesign/admin-ui-v6-traversal
    paths:
      - .github/runtime-screenshot-v6-trigger

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: redesign/admin-ui-v6-traversal
          fetch-depth: 0

      - name: Apply V6 runtime screenshot pass
        run: python3 scripts/apply_runtime_screenshot_v6.py

      - name: Static contract checks
        run: |
          set -euo pipefail
          grep -q 'commandShowsNestedWorkflow' PurePetsAdmin/App/AdminAppShell.swift
          grep -q 'safeAreaLayoutGuide.bottomAnchor' PurePetsAdmin/AccessorySection/AddAccessoryViewController.m
          ! grep -q 'PPApplyElevatedShadow(dock)' PurePetsAdmin/AccessorySection/AddAccessoryViewController.m
          grep -q 'PaymentMgmt_WorkflowStatus_Pending' PurePetsAdmin/Payments/PPPaymentManagementModels.m
          grep -q 'colorWithAlphaComponent:0.11' PurePetsAdmin/Payments/PPPaymentManagementRecordCell.m
          ! grep -q 'subtitle:error.localizedDescription' PurePetsAdmin/Payments/PPPaymentManagementViewController.m

      - name: Commit generated source
        run: |
          if git diff --quiet; then
            echo 'No source changes required.'
            exit 0
          fi
          git config user.name 'pure-pets-v6-bot'
          git config user.email 'pure-pets-v6-bot@users.noreply.github.com'
          git add PurePetsAdmin/App/AdminAppShell.swift \
                  PurePetsAdmin/Shared/Routing/AdminRoute.swift \
                  PurePetsAdmin/AccessorySection/AddAccessoryViewController.m \
                  PurePetsAdmin/Payments/PPPaymentManagementModels.m \
                  PurePetsAdmin/Payments/PPPaymentManagementViewController.m \
                  PurePetsAdmin/Payments/PPPaymentManagementRecordCell.m
          git commit -m 'Refine runtime admin screens with SwiftyMax V6'
          git push origin HEAD:redesign/admin-ui-v6-traversal
