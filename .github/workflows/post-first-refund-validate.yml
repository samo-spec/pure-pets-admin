name: Validate post-first-refund routing

on:
  push:
    branches:
      - fix/post-first-refund-multi-refund
    paths:
      - .github/workflows/post-first-refund-validate.yml

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/post-first-refund-multi-refund
          fetch-depth: 0

      - name: Diff scope and whitespace safety
        run: |
          set -euo pipefail
          git diff --check origin/main...HEAD
          changed=$(git diff --name-only origin/main...HEAD | sort)
          test "$changed" = "PurePetsAdmin/Features/POS/POSHistoryView.swift"

      - name: Post-first-refund behavioral contract
        shell: python
        run: |
          from pathlib import Path
          p = Path("PurePetsAdmin/Features/POS/POSHistoryView.swift")
          text = p.read_text()
          assert "if let firstReturnCase = returnCases.first" not in text
          assert text.count("Existing return cases are history") == 2
          assert text.count("selectedReturnCaseForDetail = rCase") == 2
          assert "let available = max(0, item.quantity - item.refundedQuantity)" in text
          assert 'return st == "refunded" || st == "partially_refunded" || effectiveRefundedAmount > 0' in text
          assert 'return !receipt.items.isEmpty && receipt.items.allSatisfy { $0.refundedQuantity >= $0.quantity }' in text
          print("Post-first-refund contract checks passed.")

      - name: Swift parser check when toolchain is available
        run: |
          set -euo pipefail
          if command -v swiftc >/dev/null 2>&1; then
            swiftc -frontend -parse PurePetsAdmin/Features/POS/POSHistoryView.swift
          else
            echo "swiftc not installed on runner; parser check deferred to native macOS build gate."
          fi
