name: Apply post-first-refund routing patch

on:
  push:
    branches:
      - fix/post-first-refund-multi-refund
    paths:
      - .github/workflows/post-first-refund-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/post-first-refund-multi-refund
          fetch-depth: 0

      - name: Patch only post-first-refund dossier routing
        shell: python
        run: |
          from pathlib import Path
          import re
          path = Path("PurePetsAdmin/Features/POS/POSHistoryView.swift")
          text = path.read_text()
          pattern = re.compile(
              r'(?P<indent>\s*)onRefund: \{\n'
              r'(?P=indent)    DossierHaptics\.medium\(\)\n'
              r'(?P=indent)    if let firstReturnCase = returnCases\.first \{\n'
              r'(?P=indent)        selectedReturnCaseForDetail = firstReturnCase\n'
              r'(?P=indent)    \} else \{\n'
              r'(?P=indent)        onRefund\(\)\n'
              r'(?P=indent)    \}\n'
              r'(?P=indent)\},'
          )
          matches = list(pattern.finditer(text))
          if len(matches) != 2:
              raise SystemExit(f"Expected exactly 2 post-refund routing sites, found {len(matches)}; refusing to patch.")
          def replacement(match):
              i = match.group('indent')
              return (
                  f"{i}onRefund: {{\n"
                  f"{i}    DossierHaptics.medium()\n"
                  f"{i}    // Existing return cases are history and have their own explicit\n"
                  f"{i}    // dossier buttons. They must never hijack the primary refund\n"
                  f"{i}    // action: a partially-refunded sale can still refund any\n"
                  f"{i}    // remaining eligible quantity or exact live-pet unit.\n"
                  f"{i}    onRefund()\n"
                  f"{i}}},"
              )
          path.write_text(pattern.sub(replacement, text))

      - name: Static scope guard
        shell: python
        run: |
          from pathlib import Path
          text = Path("PurePetsAdmin/Features/POS/POSHistoryView.swift").read_text()
          if "if let firstReturnCase = returnCases.first" in text:
              raise SystemExit("Stale refund hijack remains.")
          if text.count("Existing return cases are history") != 2:
              raise SystemExit("Expected iPhone and iPad routing guards.")
          print("Post-first-refund routing patch verified at exactly two dossier sites.")

      - name: Commit patch and remove temporary workflow
        shell: bash
        run: |
          rm .github/workflows/post-first-refund-patch.yml
          git config user.name "Pure Pets implementation bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix: allow subsequent refunds after partial refund"
          git push origin HEAD:fix/post-first-refund-multi-refund
