name: Apply post-first-refund dossier polish

on:
  push:
    branches:
      - fix/post-first-refund-multi-refund
    paths:
      - .github/workflows/post-first-refund-polish.yml

permissions:
  contents: write

jobs:
  patch-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/post-first-refund-multi-refund
          fetch-depth: 0
      - name: Apply deterministic post-refund patch
        run: python3 scripts/apply_post_first_refund_polish.py
      - name: Review scope and parse
        run: |
          set -euo pipefail
          git diff --check
          changed=$(git diff --name-only | sort)
          expected=$(printf '%s\n' PurePetsAdmin/Features/POS/POSHistoryView.swift PurePetsAdmin/ar.lproj/Localizable.strings PurePetsAdmin/en.lproj/Localizable.strings | sort)
          test "$changed" = "$expected"
          python3 -c "from pathlib import Path; t=Path('PurePetsAdmin/Features/POS/POSHistoryView.swift').read_text(); assert t.count('private var refundActionTitle: String') == 2; assert t.count('Text(refundActionTitle)') == 2; assert 'POS_Refund_ItemProgress' in t; assert 'POS_Refund_NetRetained' in t; assert 'if let firstReturnCase = returnCases.first' not in t; print('Post-refund-only UI contracts passed.')"
          swiftc -frontend -parse PurePetsAdmin/Features/POS/POSHistoryView.swift
      - name: Commit source and remove temporary harness
        run: |
          rm .github/workflows/post-first-refund-polish.yml
          rm scripts/apply_post_first_refund_polish.py
          git config user.name 'Pure Pets implementation bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'polish: clarify subsequent refund lifecycle'
          git push origin HEAD:fix/post-first-refund-multi-refund
